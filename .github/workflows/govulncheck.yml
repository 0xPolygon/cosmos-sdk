name: Govuln
on: [push, pull_request]

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          check-latest: true
      - name: govulncheck
        run: make vulncheck
