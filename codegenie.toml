# codegenie AI code review config. See https://github.com/0xPolygon/codegenie
#
# Provider credentials and model selection live in the workflow
# (.github/workflows/codegenie-review.yml) for CI and in ~/.codegenie/ locally;
# only repo-safe review/classification keys belong here.
#
# baseBranch applies to local `codegenie review` on a branch. CI runs in PR
# mode, where the base comes from the PR itself and this key is unused.
#
# This is a fork that tracks upstream cosmos-sdk. Reviews are on-demand, so
# upstream-merge PRs are simply never triggered; priorities below are tuned for
# PoS-authored changes.

[git]
baseBranch = "devel"

[review]
depth = "normal"

# Generated code — regenerated by tooling, not hand-reviewed.

[[classification.pathRules]]
pattern = "**/*.pb.go"
processingMode = "skip"
reason = "protoc-generated protobuf bindings"

[[classification.pathRules]]
pattern = "**/*.pb.gw.go"
processingMode = "skip"
reason = "grpc-gateway-generated REST shims"

[[classification.pathRules]]
pattern = "**/*.pulsar.go"
processingMode = "skip"
reason = "protoc-gen-go-pulsar generated fast-path codec"

[[classification.pathRules]]
pattern = "api/**"
processingMode = "skip"
reason = "generated API module (buf generate)"

[[classification.pathRules]]
pattern = "**/*_mocks.go"
processingMode = "skip"
reason = "mockgen-generated test doubles (scripts/mockgen.sh)"

[[classification.pathRules]]
pattern = "**/*_mock.go"
processingMode = "skip"
reason = "mockgen-generated test doubles (scripts/mockgen.sh)"

[[classification.pathRules]]
pattern = "**/testutil/mock/**"
processingMode = "skip"
reason = "mockgen-generated test doubles (scripts/mockgen.sh)"

[[classification.pathRules]]
pattern = "store/mock/**"
processingMode = "skip"
reason = "mockgen-generated cosmos-db DB double (scripts/mockgen.sh)"

# Only auth, bank, and gov are wired into heimdall-v2's app. The rest of
# upstream's module set is not enabled, so changes there can't affect our
# chain — reviewed, but not at the expense of budget on the wired path.

[[classification.pathRules]]
pattern = "x/auth/**"
reviewPriority = "critical"
labels = ["consensus", "ante"]
reason = "ante chain and fee deduction; wired into heimdall-v2 and consensus-affecting"

[[classification.pathRules]]
pattern = "x/bank/**"
reviewPriority = "critical"
labels = ["funds"]
reason = "balance accounting and transfer restrictions; fund-loss surface, wired into heimdall-v2"

[[classification.pathRules]]
pattern = "x/gov/**"
reviewPriority = "critical"
labels = ["governance"]
reason = "proposal and tally logic; wired into heimdall-v2, and tally behavior is height-gated on our chain"

[[classification.pathRules]]
pattern = "baseapp/**"
reviewPriority = "critical"
labels = ["consensus"]
reason = "ABCI entrypoints, ante/post handler dispatch, deterministic tx execution"

[[classification.pathRules]]
pattern = "types/**"
reviewPriority = "high"
labels = ["wire"]
reason = "coin math, address codecs, and shared encoding used by every wired module"

[[classification.pathRules]]
pattern = "store/**"
reviewPriority = "high"
labels = ["state"]
reason = "commit-store and IAVL behavior; app-hash determinism"

[[classification.pathRules]]
pattern = "crypto/**"
reviewPriority = "high"
labels = ["crypto"]
reason = "keyring and signing paths; validator key handling"

[[classification.pathRules]]
pattern = "x/authz/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/circuit/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/crisis/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/distribution/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/evidence/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/feegrant/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/group/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/mint/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/nft/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/slashing/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app"

[[classification.pathRules]]
pattern = "x/staking/**"
reviewPriority = "low"
reason = "module not enabled in heimdall-v2's app; staking lives in heimdall-v2's own x/stake"

[[classification.pathRules]]
pattern = "simapp/**"
reviewPriority = "low"
reason = "upstream simulation app, not shipped by us"
